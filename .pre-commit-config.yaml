# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
fail_fast: false
default_stages: [pre-commit]

repos:
  # Black: formateador de Python
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
    - id: black
      args: [--config, ml_framework/pyproject.toml, --fast]
      types: [python]
      files: ^ml_framework/

   # Ruff: linter y autofix para Python
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: "v0.11.2"
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^ml_framework/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: sort-simple-yaml

    # MyPy: validación de tipos
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: ["--config-file", "ml_framework/pyproject.toml"]
        types: [python]
        files: ^ml_framework/
        exclude: ^(test|ml_framework/test)/

    # ESLint: Lint JavaScript/TypeScript
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.22.0
    hooks:
      - id: eslint
        args: ["--fix"]
        types: [file]
        files: ^(frontend/|backend/)
